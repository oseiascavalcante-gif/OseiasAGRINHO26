<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte e Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <div id="titleScreen">
        <h1>AGRO FORTE E SUSTENTÁVEL</h1>
        <p>Uma jornada pela sustentabilidade</p>
        <button id="startBtn">INICIAR</button>
    </div>

    <div id="battleScreen" class="hidden">

        <div id="bossArea">
            <h2 id="bossName">Seca Extrema</h2>
            <div id="bossSprite"></div>
            <div id="bossHPBar">
                <div id="bossHP"></div>
            </div>
        </div>

        <canvas id="battleCanvas" width="600" height="250"></canvas>

        <div id="dialogueBox">
            <p id="dialogueText">
                Bem-vindo ao Agro Forte e Sustentável.
            </p>
        </div>

        <div id="menu">
            <button class="actionBtn" data-action="fight">FIGHT</button>
            <button class="actionBtn" data-action="act">ACT</button>
            <button class="actionBtn" data-action="item">ITEM</button>
            <button class="actionBtn" data-action="spare">SPARE</button>
        </div>

        <div id="playerInfo">
            <span>HP:</span>
            <div id="playerHPBar">
                <div id="playerHP"></div>
            </div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
