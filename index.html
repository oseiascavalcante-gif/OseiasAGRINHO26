<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sementes do Destino: Eco-Crônicas</title>
    <style>
        /* Estilização Geral estilo RPG Retrô / Deltarune */
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-window {
            width: 700px;
            height: 500px;
            border: 4px solid white;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: bween;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Arena Visual do Inimigo */
        #battle-arena {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #enemy-sprite {
            font-size: 70px;
            margin-bottom: 10px;
            transition: transform 0.2s ease;
        }

        #enemy-hp-bar {
            width: 200px;
            height: 12px;
            border: 2px solid white;
            background: #333;
            position: relative;
        }

        #enemy-hp-fill {
            width: 100%;
            height: 100%;
            background: #ff0055;
            transition: width 0.3s ease;
        }

        #enemy-mercy-bar {
            width: 200px;
            height: 8px;
            border: 2px solid white;
            background: #333;
            margin-top: 5px;
            position: relative;
        }

        #enemy-mercy-fill {
            width: 0%;
            height: 100%;
            background: #e6ff00;
            transition: width 0.3s ease;
        }

        /* Caixa de Diálogo Centralizada */
        #dialogue-box {
            height: 120px;
            border: 3px solid white;
            padding: 15px;
            font-size: 18px;
            line-height: 1.4;
            background: black;
            margin-bottom: 15px;
            overflow-y: auto;
        }

        /* Menu de Botões (Interface Deltarune) */
        #action-menu {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .menu-btn {
            flex: 1;
            background: black;
            border: 2px solid #555;
            color: #aaa;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .menu-btn:hover {
            border-color: #ff9800;
            color: #ff9800;
        }

        .menu-btn:disabled {
            border-color: #222;
            color: #333;
            cursor: not-allowed;
        }

        /* Tela do Pergaminho de Lore (Pop-up Histórico) */
        #lore-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #lore-scroll {
            width: 80%;
            background: #f4ecd8;
            color: #4a2f13;
            padding: 30px;
            border-radius: 4px;
            border: 5px double #8a6d4d;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            text-align: center;
        }

        #lore-scroll h3 {
            margin-top: 0;
            border-bottom: 2px dashed #8a6d4d;
            padding-bottom: 10px;
        }

        #lore-scroll p {
            font-size: 16px;
            line-height: 1.6;
            text-align: justify;
        }

        #lore-scroll button {
            background: #8a6d4d;
            color: white;
            border: none;
            padding: 10px 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        #player-status {
            font-size: 14px;
            margin-bottom: 5px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h2 style="color: #4caf50; margin-bottom: 10px;">Sementes do Destino: Eco-Crônicas</h2>

    <div id="game-window">
        <!-- Parte Superior: Arena de Combate -->
        <div id="battle-arena">
            <div id="player-status">HERÓI DO AGRO - HP: 100/100</div>
            <div id="enemy-name" style="font-weight: bold; margin-bottom: 5px;">Monstro Terrível</div>
            <div id="enemy-sprite">🪨</div>
            
            <div>HP do Inimigo:</div>
            <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
            
            <div style="margin-top: 5px;">MERCY (Piedade):</div>
            <div id="enemy-mercy-bar"><div id="enemy-mercy-fill"></div></div>
        </div>

        <!-- Parte Central: Caixa de Texto Narrativa -->
        <div id="dialogue-box">
            * Você encontrou uma criatura bloqueando a rota sustentável! Prepare-se.
        </div>

        <!-- Parte Inferior: Botões de Comando Estilo RPG -->
        <div id="action-menu">
            <button class="menu-btn" onclick="handleAttack()">⚔️ FIGHT</button>
            <button class="menu-btn" onclick="handleAct()">💬 ACT</button>
            <button class="menu-btn" id="spare-btn" onclick="handleSpare()" disabled>💛 SPARE</button>
        </div>

        <!-- Pop-up do Papel com a Lore Oculta -->
        <div id="lore-overlay">
            <div id="lore-scroll">
                <h3 id="lore-title">📜 Fragmento de Lore Encontrado</h3>
                <p id="lore-text">Texto da crônica ambiental...</p>
                <button onclick="closeLore()">Continuar Jornada</button>
            </div>
        </div>
    </div>

    <script>
        // Banco de Dados dos Inimigos e da Lore Pedagógica Desbloqueada por Abate/Piedade
        const enemyDatabase = [
            {
                name: "Gárgula da Erosão",
                sprite: "🏜️",
                hp: 100,
                actText: "* Você decide fazer o terraceamento mecânico e plantar árvores nativas nas encostas para segurar o solo.",
                spawnText: "* A Gárgula da Erosão impede o avanço! O solo está rachado e desprotegido.",
                loreTitle: "Crônica I: O Escudo da Terra (Curitiba, PR)",
                loreText: "Registros antigos mostram que o Paraná perdeu toneladas de terra fértil antes da chegada do plantio direto e das curvas de nível. Ao pacificar ou conter a erosão, descobrimos que manter o solo coberto com palhada reduz o impacto da chuva em até 90%. O Agro forte nasce protegendo a base de tudo."
            },
            {
                name: "Espírito da Água Turva",
                sprite: "🌊",
                hp: 120,
                actText: "* Você inicia o isolamento das fontes e o plantio de mata ciliar nas margens dos rios da propriedade.",
                spawnText: "* O Espírito da Água Turva surge chorando defensivos químicos e resíduos industriais.",
                loreTitle: "Crônica II: As Veias do Estado Hídrico",
                loreText: "A água que abastece as cidades nasce no interior de pequenas propriedades rurais. Quando o produtor protege as matas ciliares (Mata de Galeria), ele impede que defensivos ou terra caiam no leito dos rios. Preservar as bacias hidrográficas do Paraná garante energia barata e alimentos puros."
            },
            {
                name: "Titã do Desperdício",
                sprite: "🗑️",
                hp: 150,
                actText: "* Você implementa sensores automáticos de irrigação por gotejamento e compostagem orgânica de restos de grãos.",
                spawnText: "* O Titã do Desperdício espalha fumaça de queimadas e queima recursos preciosos.",
                loreTitle: "Crônica III: O Amanhã Conectado",
                loreText: "A tecnologia no campo não serve apenas para produzir mais, mas para erradicar o desperdício. O equilíbrio moderno usa tratores guiados por GPS e drones agrícolas para aplicar insumos na quantidade milimétrica necessária. O futuro sustentável une o conhecimento tradicional à inteligência dos dados digitais."
            }
        ];

        let currentEnemyIndex = 0;
        let currentEnemy = null;
        let enemyHP = 100;
        let enemyMercy = 0;

        const dbBox = document.getElementById("dialogue-box");
        const hpFill = document.getElementById("enemy-hp-fill");
        const mercyFill = document.getElementById("enemy-mercy-fill");
        const spareBtn = document.getElementById("spare-btn");
        const spriteEl = document.getElementById("enemy-sprite");
        const nameEl = document.getElementById("enemy-name");

        function loadEnemy() {
            if (currentEnemyIndex >= enemyDatabase.length) {
                dbBox.innerHTML = "* Parabéns! Você limpou toda a corrupção da região e garantiu o Futuro Sustentável do Agro! O Selo Ouro do Agrinho é seu.";
                document.querySelectorAll(".menu-btn").forEach(b => b.disabled = true);
                nameEl.innerText = "Vitória Total!";
                spriteEl.innerHTML = "🏆";
                return;
            }

            currentEnemy = enemyDatabase[currentEnemyIndex];
            enemyHP = currentEnemy.hp;
            enemyMercy = 0;

            nameEl.innerText = currentEnemy.name;
            spriteEl.innerHTML = currentEnemy.sprite;
