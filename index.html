<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>AgroTale</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🎬 TRAILER -->
<div id="trailer">
  <p id="trailer-texto"></p>
</div>

<!-- 🎮 MENU -->
<div id="start">
  <div class="menu-box">
    <h1 class="titulo">🌾 AGROTALE</h1>

    <p class="subtitulo">
      Um mundo onde suas escolhas definem o futuro da agricultura e da natureza.
    </p>

    <button class="btn-start" onclick="iniciarJogo()">▶ INICIAR JORNADA</button>

    <p class="hint">Use escolhas com sabedoria...</p>
  </div>
</div>

<!-- 🎮 GAME -->
<div id="game" style="display:none">

  <div id="personagem">🌱</div>

  <div id="dialogo">
    <p id="texto"></p>
  </div>

  <div id="botoes">
    <button onclick="escolher('a')">🌱 Opção A</button>
    <button onclick="escolher('b')">🚜 Opção B</button>
  </div>

  <div id="hud">

    <div class="barra">
      🌱 Ambiente
      <div class="progress"><div id="bar-ambiente"></div></div>
      <span id="ambiente">50</span>
    </div>

    <div class="barra">
      🚜 Produção
      <div class="progress"><div id="bar-producao"></div></div>
      <span id="producao">50</span>
    </div>

    <div class="barra">
      🏘️ Comunidade
      <div class="progress"><div id="bar-comunidade"></div></div>
      <span id="comunidade">50</span>
    </div>

  </div>

</div>

<!-- 🏆 FINAL -->
<div id="dashboard"></div>

<!-- 📖 EPÍLOGO -->
<div id="epilogo">
  <p id="epilogo-texto"></p>
  <button onclick="location.reload()">Reiniciar história</button>
</div>

<script src="script.js"></script>
</body>
</html>
