<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>AgroTale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🎬 CUTSCENE -->
<div id="cutscene">
  <p id="cutscene-texto"></p>
</div>

<!-- 🎬 INTRO -->
<div id="intro">
  <p id="introTexto"></p>
</div>

<div id="start">
  <h1>AGROTALE</h1>
  <button onclick="iniciarJogo()">START</button>
</div>

<div id="game" style="display:none">

  <div id="personagem">🌱</div>

  <div id="dialogo">
    <p id="texto"></p>
  </div>

  <div id="botoes">
    <button onclick="escolher('a')">🌱 Opção A</button>
    <button onclick="escolher('b')">🚜 Opção B</button>
  </div>

  <!-- 🎮 HUD -->
  <div id="hud">
    <div class="barra">
      🌱 Ambiente
      <div class="progress"><div id="bar-ambiente"></div></div>
      <span id="ambiente">50</span>
    </div>

    <div class="barra">
      🚜 Produção
      <div class="progress"><div id="bar-producao"></div></div>
      <span id="producao">50</span>
    </div>

    <div class="barra">
      🏘️ Comunidade
      <div class="progress"><div id="bar-comunidade"></div></div>
      <span id="comunidade">50</span>
    </div>
  </div>

</div>

<!-- 🏆 FINAL DASHBOARD -->
<div id="dashboard">
  <h2 id="dash-titulo"></h2>
  <p id="dash-historia"></p>

  <div class="metricas">
    🌱 Ambiente: <span id="d-ambiente"></span><br>
    🚜 Produção: <span id="d-producao"></span><br>
    🏘️ Comunidade: <span id="d-comunidade"></span><br>
    📊 Média: <span id="d-media"></span><br>
    🌪️ Estado: <span id="d-crise"></span>
  </div>

  <br>
  <button onclick="reiniciar()">Jogar novamente</button>
</div>

<script src="script.js"></script>
</body>
</html>
