<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>AgroTale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start">
  <h1>AGROTALE</h1>
  <button onclick="iniciarJogo()">START</button>
</div>

<div id="game" style="display:none">

  <div id="dialogo">
    <p id="texto"></p>
  </div>

  <div id="botoes">
    <button onclick="escolher(1)">Opção A</button>
    <button onclick="escolher(2)">Opção B</button>
  </div>

  <div id="status">
    🌱 Ambiente: <span id="ambiente">50</span> |
    🚜 Produção: <span id="producao">50</span> |
    🏘️ Comunidade: <span id="comunidade">50</span>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
