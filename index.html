<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>AgroTale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔥 TELA INICIAL -->
<div id="start">
  <h1>AGROTALE</h1>
  <button onclick="iniciarJogo()">START</button>
</div>

<!-- 🎮 JOGO -->
<div id="game" style="display:none">

  <!-- 🌱 PERSONAGEM -->
  <div id="personagem">🌱</div>

  <!-- 💬 CAIXA DE DIÁLOGO -->
  <div id="dialogo">
    <p id="texto"></p>
  </div>

  <!-- 🎯 OPÇÕES -->
  <div id="botoes">
    <button onclick="escolher(1)">Opção A</button>
    <button onclick="escolher(2)">Opção B</button>
  </div>

  <!-- 📊 STATUS -->
  <div id="status">
    🌱 Ambiente: <span id="ambiente">50</span> |
    🚜 Produção: <span id="producao">50</span> |
    🏘️ Comunidade: <span id="comunidade">50</span>
  </div>

  <!-- 🏁 FINAL -->
  <div id="fim" style="display:none">
    <h2 id="textoFinal"></h2>
    <button onclick="reiniciar()">Jogar novamente</button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
